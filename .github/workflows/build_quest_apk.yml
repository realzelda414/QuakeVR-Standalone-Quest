name: Build QuakeVR Quest 3 APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25c

      - name: Download Meta OpenXR Loader for ARM64
        run: |
          mkdir -p app/src/main/cpp/libs/arm64-v8a
          # Download official Khronos / Meta OpenXR Android Loader binary
          curl -L -o openxr_loader.aar https://github.com/KhronosGroup/OpenXR-SDK-Source/releases/download/release-1.0.34/openxr_loader_for_android-1.0.34.aar
          unzip -p openxr_loader.aar jni/arm64-v8a/libopenxr_loader.so > app/src/main/cpp/libs/arm64-v8a/libopenxr_loader.so
          rm openxr_loader.aar

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.5

      - name: Build APK with Gradle
        run: |
          gradle assembleRelease --stacktrace

      - name: Upload Quest 3 APK
        uses: actions/upload-artifact@v4
        with:
          name: QuakeVR-Quest3-Release-APK
          path: app/build/outputs/apk/release/*.apk
